<!DOCTYPE html>
<!--
  코덱스 첫걸음 강의 웹슬라이드 · 36장
  Firebase 설정 전에는 자유 열람 · 설정 뒤에는 강사용 ?admin 과 청중 동기화 사용
  localStorage 접두사 codex100_ · 번호와 목차는 admin.html 에서 함께 관리
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>코덱스 첫걸음과 소개 페이지 제작 · 정확한 수정 요청과 안심 활용법</title>
<meta name="description" content="코딩 경험이 없는 40~60대 중장년층을 위한 36장 강의 슬라이드 · 2026년 10월 9일 · 강사 이연희">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#111111; --sub:#555555; --mute:#767676;
  --line:#E3E3E3;
  --slide-bg:#F4F4F3; --card:#FFFFFF;
  --accent:#F6C744; --accent-sub:#3A3000;
  --shadow:0 .45cqi 1.4cqi rgba(0,0,0,.09), 0 .1cqi .3cqi rgba(0,0,0,.07);
  --shadow-lg:0 .8cqi 2.4cqi rgba(0,0,0,.13), 0 .18cqi .45cqi rgba(0,0,0,.08);
  --alert:#D32F2F;
  --nav-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0E0E0E;color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:inherit;text-wrap:balance;letter-spacing:-.01em}
p,li{text-wrap:pretty}
button{font-family:inherit}

/* 16:9 무대 · 모든 크기를 무대 폭 기준 cqi로 → 창 크기와 무관하게 같은 비율 */
#stage{position:fixed;left:50%;top:calc((100vh - var(--nav-h)) / 2);transform:translate(-50%,-50%);
  width:min(100vw, calc((100vh - var(--nav-h)) * 16 / 9));aspect-ratio:16/9;
  container-type:inline-size;background:var(--slide-bg);overflow:hidden}

.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:4.6cqi 6cqi;background:var(--slide-bg);color:var(--ink)}
.slide.active{display:flex}
.slide-content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.8cqi;min-height:0}

/* 타이포 (단위 cqi) */
.kicker{display:flex;align-items:center;gap:1cqi;font-size:1.6cqi;font-weight:800;letter-spacing:.06em;color:var(--ink)}
.kicker::before{content:'';flex:0 0 auto;width:2.4cqi;height:.36cqi;background:currentColor}
h1{font-size:6cqi;font-weight:900;line-height:1.22}
h2{font-size:3.9cqi;font-weight:800;line-height:1.28}
.lede{font-size:2.2cqi;color:var(--sub);line-height:1.6}

/* 표지·마침: 머스타드 옐로 / 휴식: 검정 반전 */
.title-slide{background:var(--accent);color:#111111}
.title-slide .slide-content{align-items:center;text-align:center}
.title-slide .kicker{color:#111111}
.title-slide h1::after{content:'';display:block;width:6cqi;height:.4cqi;background:#111111;margin:2.4cqi auto 0}
.title-slide .lede{color:var(--accent-sub)}
.slide.dark{background:#111111;color:#FFFFFF}
.slide.dark .kicker{color:#FFFFFF}
.slide.dark .lede{color:#BDBDBD}
.meta-row{display:flex;justify-content:center;gap:1.2cqi;flex-wrap:wrap;font-size:1.7cqi}
.meta-row span{border:.18cqi solid #111111;border-radius:99cqi;padding:.7cqi 2cqi;color:#111111;font-weight:600}

/* 불릿: 한 줄씩 그림자 박스 */
.bullets{display:flex;flex-direction:column;gap:1.2cqi}
.bullets li{list-style:none;display:flex;gap:1.4cqi;align-items:flex-start;font-size:2.25cqi;line-height:1.55;
  background:var(--card);box-shadow:var(--shadow);border-radius:1cqi;padding:1.25cqi 2cqi}
.bullets li::before{content:'';flex:0 0 auto;width:.75cqi;height:.75cqi;background:var(--ink);margin-top:1.36cqi}
.slide-content a{color:inherit;text-underline-offset:.3em;text-decoration-thickness:.15em}

/* 카드 */
.card-grid{display:grid;gap:1.8cqi}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:1.2cqi;box-shadow:var(--shadow-lg);padding:2.2cqi;
  display:flex;flex-direction:column;gap:.8cqi;min-width:0}
.card .n{font-size:3.4cqi;font-weight:900;line-height:1;color:var(--ink)}
.card .t{font-size:2.3cqi;font-weight:800}
.card .d{font-size:1.8cqi;color:var(--sub);line-height:1.5}
/* 색으로만 구분 금지: 아쉬운 예 = 점선 + ✕, 좋은 예 = 굵은 검정 막대 + ✓ */
.card.bad{background:#FAFAFA;box-shadow:none;border:.2cqi dashed #9E9E9E}
.card.bad .t{color:var(--sub)}
.card.bad .t::before{content:'✕  '}
.card.good{border-left:.7cqi solid var(--ink)}
.card.good .t::before{content:'✓  '}

/* 표 */
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:1.85cqi;line-height:1.35;
  background:var(--card);box-shadow:var(--shadow-lg);border-radius:1.2cqi;overflow:hidden}
table.tbl th, table.tbl td{padding:.8cqi 1.6cqi;text-align:left;border-bottom:.12cqi solid var(--line)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl th{background:#111111;color:#FFFFFF;font-weight:800}
table.tbl tr.today td{font-weight:800}
table.tbl tr.today td:first-child{box-shadow:inset .55cqi 0 0 #111111}
table.tbl td:first-child, table.tbl th:first-child{white-space:nowrap}
table.tbl td:first-child{color:var(--sub)}

/* 프롬프트 카드: 검정 박스 + 오른쪽 위 복사 버튼 */
.prompt-card{position:relative;background:#111111;color:#F2F2F2;border-radius:1.2cqi;box-shadow:var(--shadow-lg);
  padding:2cqi 2.4cqi;display:flex;flex-direction:column;gap:1cqi}
.prompt-card .label{font-size:1.5cqi;font-weight:800;letter-spacing:.06em;color:#BDBDBD;padding-right:14cqi}
.prompt-card blockquote{font-size:2cqi;line-height:1.6;color:#FFFFFF;border-left:.3cqi solid #666666;padding-left:1.6cqi;
  font-style:normal;white-space:pre-wrap}
.copy-btn{position:absolute;top:1.5cqi;right:1.6cqi;font-size:1.5cqi;font-weight:800;
  padding:.7cqi 1.8cqi;border-radius:99cqi;border:none;background:#FFFFFF;color:#111111;cursor:pointer;min-height:44px;min-width:44px}
.copy-btn:hover, .copy-btn.copied{background:#E2E2E2}
.copy-btn:focus-visible{outline:.25cqi solid #FFFFFF;outline-offset:.25cqi}

/* 타이머: 클릭 시작/일시정지 · 더블클릭 또는 R 키 리셋 */
.timer-chip{display:inline-flex;align-items:center;gap:1cqi;align-self:flex-start;cursor:pointer;user-select:none;
  background:var(--card);box-shadow:var(--shadow);border:.18cqi solid var(--ink);border-radius:99cqi;min-height:44px;
  padding:.9cqi 2.2cqi;font-size:2cqi;font-weight:800;color:var(--ink)}
.timer-chip .time{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.timer-chip.running{background:#111111;color:#FFFFFF}
.timer-chip.warn .time{color:var(--alert)}
.timer-chip.running.warn .time{color:#FF8A80}
.timer-chip .state{font-size:1.4cqi;font-weight:700;opacity:.8}
.timer-chip:focus-visible, .break-big:focus-visible{outline:.3cqi solid currentColor;outline-offset:.4cqi}
.break-big{cursor:pointer;user-select:none;text-align:center;font-variant-numeric:tabular-nums;background:none;border:none;
  font-size:16cqi;font-weight:900;line-height:1.05;color:#FFFFFF;min-height:44px;border-radius:1cqi}
.break-big.warn{color:#FF8A80}

/* 하단 네비 */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:#0E0E0E;border-top:1px solid #222;
  display:flex;align-items:center;gap:8px;padding:0 14px;color:#EEEEEE;font-size:14px;z-index:200}
#nav button, #nav a{background:#1F1F1F;color:#EEEEEE;border:1px solid #2E2E2E;border-radius:8px;
  height:44px;min-width:44px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#nav button:hover, #nav a:hover{background:#2C2C2C}
#nav button:disabled{opacity:.35;cursor:default}
#nav button:focus-visible, #nav a:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
#nav .grow{flex:1}
#counter{font-variant-numeric:tabular-nums;font-weight:800;min-width:5.5em;text-align:center}
#syncStatus{font-size:12px;color:#BBBBBB;white-space:nowrap}
#adminControls{display:none;align-items:center;gap:6px}
#adminControls.show{display:flex}
#adminControls button{padding:0 10px}
.login{position:fixed;inset:0;z-index:600;background:rgba(10,10,10,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.login[hidden]{display:none}
.login-box{background:#FFF;color:#111;border-radius:14px;padding:24px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;font-family:inherit}
.login-box h2{font-size:20px}
.login-box label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.login-box input{font:inherit;font-weight:500;border:1px solid #BBB;border-radius:8px;padding:10px 12px;min-height:44px}
.login-box .row{display:flex;gap:8px}
.login-box button{font:inherit;font-weight:800;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #BBB;background:#FFF;cursor:pointer}
.login-box button.primary{background:#111;color:#FFF;border-color:#111}
.login-box .err{color:#B71C1C;font-size:13px;font-weight:700;min-height:1.2em}
#nav button[hidden]{display:none!important}
.hint{color:#9A9A9A;font-size:12.5px}
#progress{position:fixed;left:0;bottom:var(--nav-h);height:3px;background:#FFFFFF;width:0;z-index:201;transition:width .2s}
@media (max-width:760px){
  :root{--nav-h:112px}
  #nav{height:auto;min-height:var(--nav-h);flex-wrap:wrap;align-content:center;gap:6px;padding:6px 8px}
  #nav .hide-sm,#nav .grow{display:none}
  #adminControls{gap:4px}
  #adminControls button{padding:0 7px;font-size:12px}
}
@media (max-width:480px){:root{--nav-h:160px}}

/* 전체보기: 실제 축소판 */
.grid-overlay{position:fixed;inset:0;z-index:500;background:rgba(10,10,10,.97);display:none;overflow:auto;padding:22px 22px 40px}
.grid-overlay.open{display:block}
.grid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.grid-head h2{color:#FFFFFF;font-size:20px;font-weight:800}
.grid-head button{background:#1F1F1F;color:#EEEEEE;border:1px solid #2E2E2E;border-radius:8px;height:44px;padding:0 16px;
  font-size:14px;font-weight:700;cursor:pointer}
.grid-head button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.grid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mini{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;cursor:pointer;
  outline:3px solid transparent;outline-offset:2px;background:var(--slide-bg)}
.mini:hover, .mini:focus-visible, .mini.current{outline-color:#FFFFFF}
/* 960px 기준으로 그린 뒤 축소 · 240px에 직접 그리면 브라우저 최소 글꼴 크기에 걸려 넘침 */
.mini-inner{position:absolute;left:0;top:0;width:960px;height:540px;container-type:inline-size;
  transform-origin:0 0;pointer-events:none;background:var(--slide-bg)}
.mini-inner .slide{display:flex}
.mini-num{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.78);color:#FFFFFF;font-size:12px;font-weight:700;
  padding:2px 8px;border-radius:99px;z-index:2}

@media (prefers-reduced-motion:reduce){ #progress{transition:none} }

/* PDF: 16:9 페이지 1장 = 슬라이드 1장 */
@page{size:13.333in 7.5in;margin:0}
@media print{
  html, body{overflow:visible!important;height:auto!important;background:#FFFFFF}
  #nav, #progress, .grid-overlay{display:none!important}
  #stage{position:static!important;transform:none!important;width:13.333in!important;aspect-ratio:auto!important;overflow:visible!important}
  #stage > .slide{position:relative!important;display:flex!important;width:13.333in;height:7.5in;
    break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #stage > .slide:last-child{break-after:auto;page-break-after:auto}
  html.no-pdf #stage{display:none!important}
  html.no-pdf body::before{content:"PDF 저장이 비활성화되어 있습니다. 강사에게 문의하세요.";display:block;padding:2rem;font-size:14pt;color:#000}
}
</style>
</head>
<body>

<main id="stage"></main>

<div id="progress" aria-hidden="true"></div>
<nav id="nav" aria-label="슬라이드 이동">
  <a href="index.html" target="_blank" rel="noopener" class="hide-sm" aria-label="강의 홈 새 창으로 열기">⌂ 홈</a>
  <button type="button" id="navPrev" aria-label="이전 슬라이드">◀</button>
  <span id="counter" aria-live="polite">1 / 36</span>
  <button type="button" id="navNext" aria-label="다음 슬라이드">▶</button>
  <span id="syncStatus" aria-live="polite"></span>
  <div id="adminControls" aria-label="강사 동기화 제어">
    <button type="button" id="lockBtn" aria-pressed="false">잠금 OFF</button>
    <button type="button" id="pdfBtn" aria-pressed="true">PDF ON</button>
  </div>
  <button type="button" id="loginOpen" hidden>강사 로그인</button>
  <button type="button" id="logoutBtn" hidden>로그아웃</button>
  <span class="grow"></span>
  <span class="hint hide-sm">← → 이동 · G 전체보기 · P PDF</span>
  <button type="button" id="gridBtn" aria-haspopup="dialog" aria-controls="gridOverlay">▦ 전체 보기</button>
  <button type="button" id="printBtn" class="hide-sm">⎙ PDF 저장</button>
</nav>

<div class="grid-overlay" id="gridOverlay" role="dialog" aria-modal="true" aria-label="전체 슬라이드 보기">
  <div class="grid-head"><h2>전체 보기</h2><button type="button" id="gridClose">닫기 (Esc)</button></div>
  <div class="grid-list" id="gridList"></div>
</div>

<div class="login" id="loginDialog" hidden>
  <form class="login-box" id="loginForm">
    <h2>강사 로그인</h2>
    <label>이메일<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <div class="err" id="loginError" role="status"></div>
    <div class="row"><button type="button" id="loginCancel">취소</button><button class="primary" type="submit">로그인</button></div>
  </form>
</div>

<script id="deckContent">
(function(){
  var slides = [
    {title:'표지', section:'코덱스 첫걸음', cover:true, points:['코딩 경험이 없어도 시작 가능','2026년 10월 9일 · 저녁 8시 · 온라인 Zoom','이연희 강사 · 미래 AI 연구소']},
    {title:'100분 진행 순서', section:'오늘의 순서', rows:[['1부 · 50분','코덱스 이해 · 소개 페이지 초안'],['휴식 · 5분 포함','1부 마지막에 짧은 휴식'],['2부 · 50분','수정 요청 · 안심 활용 · 마무리']]},
    {title:'오늘의 목표', section:'수업 목표', cards:[['01','코덱스 이해','대화로 파일과 웹페이지를 만드는 도구'],['02','소개 페이지 초안','내 목적과 정보를 담은 첫 결과물'],['03','안심 수정','바꾸고 싶은 점을 구체적으로 요청']]},
    {title:'코덱스 첫걸음', section:'1부 · 코덱스 이해', points:['코덱스: 작업 폴더 안의 파일을 읽고 고치는 도우미','요청 입력: 원하는 결과를 말이나 글로 전달','결과 확인: 파일과 화면을 직접 살펴보기']},
    {title:'코덱스와 대화형 AI', section:'도구의 역할', cards:[['대화','질문과 설명','아이디어 정리와 글쓰기'],['작업','파일 읽기와 수정','웹페이지와 문서 제작'],['확인','결과 비교와 보완','수정 전후를 눈으로 점검']]},
    {title:'코덱스 작업 흐름', section:'기본 흐름', points:['요청: 목표와 조건 설명','작업: 파일 읽기와 수정','미리보기: 화면에서 결과 확인','보완: 원하는 부분을 다시 요청']},
    {title:'익숙해질 화면 용어', section:'화면 읽기', cards:[['폴더','작업 공간','관련 파일을 모아 둔 장소'],['파일','작업 대상','페이지·사진·설정 등이 저장된 항목'],['미리보기','결과 화면','방문자에게 보이는 실제 모습']]},
    {title:'안전한 시작 원칙', section:'안심 활용', points:['작업 범위: 요청한 파일과 항목 확인','변경 내용: 저장·공유 전 직접 검토','개인정보: 비밀번호와 민감한 정보 입력 금지','확신이 없을 때: 멈추고 설명 요청']},
    {title:'실습 준비물', section:'실습 준비', points:['노트북과 인터넷 연결','코덱스가 열린 작업 폴더','소개할 강의·모임 정보','사진은 공개해도 되는 자료만 사용']},
    {title:'작업 폴더 선택', section:'첫 화면 준비', points:['작업 폴더: 이번 결과물을 저장할 장소','시작 전: 폴더 이름과 안의 파일 확인','요청 문장: 작업할 폴더와 파일을 구체적으로 지정','파일을 지우거나 덮어쓰기 전 확인']},

<script>
(function(){
  /* ▼ 내 강의 고유 접두사로 변경 (예: 'ai0927_') */
  var LS = 'codex100_';

  var stage = document.getElementById('stage');
  var slides = Array.prototype.slice.call(stage.querySelectorAll(':scope > section.slide'));
  var total = slides.length;
  var STORAGE_KEY = LS + 'slide';
  var idx = 0;
  var adminMode = new URLSearchParams(location.search).has('admin');
  var isAdmin = false, sync = null, syncReady = false, lockOn = false, pdfOn = true, applyingRemote = false;

  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 · 무시 */ } }

  /* 시작 위치: ?slide=N 우선, 없으면 마지막으로 본 장 */
  var params = new URLSearchParams(location.search);
  var qSlide = parseInt(params.get('slide'), 10);
  if (!isNaN(qSlide) && qSlide >= 1 && qSlide <= total) {
    idx = qSlide - 1;
  } else {
    var saved = parseInt(lsGet(STORAGE_KEY), 10);
    if (!isNaN(saved) && saved >= 0 && saved < total) idx = saved;
  }

  var progressEl = document.getElementById('progress');
  var counterEl = document.getElementById('counter');
  var navPrev = document.getElementById('navPrev');
  var navNext = document.getElementById('navNext');
  var gridOverlay = document.getElementById('gridOverlay');
  var gridList = document.getElementById('gridList');
  var minis = [];
  var lastFocus = null;

  function show(i){
    if (syncReady && lockOn && !isAdmin && !applyingRemote) return;
    idx = Math.max(0, Math.min(total - 1, i));
    slides.forEach(function(s, n){
      s.classList.toggle('active', n === idx);
      s.setAttribute('aria-hidden', n === idx ? 'false' : 'true');
    });
    progressEl.style.width = ((idx + 1) / total * 100) + '%';
    counterEl.textContent = (idx + 1) + ' / ' + total;
    navPrev.disabled = idx === 0;
    navNext.disabled = idx === total - 1;
    minis.forEach(function(m, n){ m.classList.toggle('current', n === idx); });
    lsSet(STORAGE_KEY, String(idx));
    if (syncReady && isAdmin && !applyingRemote) sync.setSlide(idx).catch(showSyncError);
  }

  function scaleMinis(){
    minis.forEach(function(m){ m.firstChild.style.transform = 'scale(' + (m.clientWidth / 960) + ')'; });
  }
  window.addEventListener('resize', function(){ if (gridOverlay.classList.contains('open')) scaleMinis(); });
  function openGrid(){
    lastFocus = document.activeElement;
    gridOverlay.classList.add('open');
    scaleMinis();
    var c = minis[idx];
    if (c) { c.scrollIntoView({block:'center'}); c.focus(); }
  }
  function closeGrid(){
    gridOverlay.classList.remove('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select')) return;
    if (gridOverlay.classList.contains('open')) {
      if (e.key === 'Escape' || e.key === 'g' || e.key === 'G') { closeGrid(); }
      return;
    }
    /* 버튼에 포커스가 있을 때 스페이스·엔터는 버튼 동작에 양보 */
    var onButton = t && t.closest && t.closest('button, a');
    if ((e.key === ' ' || e.key === 'Enter') && onButton) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
    else if (e.key === 'g' || e.key === 'G' || e.key === 'ㅎ') { openGrid(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'ㅔ') { e.preventDefault(); window.print(); }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(total - 1); }
  });

  /* 무대 클릭: 오른쪽 절반 다음 · 왼쪽 절반 이전 (버튼·링크·프롬프트 카드 제외) */
  stage.addEventListener('click', function(e){
    if (e.target.closest('button, a, .prompt-card')) return;
    var rect = stage.getBoundingClientRect();
    if (e.clientX - rect.left > rect.width / 2) show(idx + 1); else show(idx - 1);
  });
  navPrev.addEventListener('click', function(){ show(idx - 1); });
  navNext.addEventListener('click', function(){ show(idx + 1); });
  document.getElementById('gridBtn').addEventListener('click', openGrid);
  document.getElementById('gridClose').addEventListener('click', closeGrid);
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  var loginDialog = document.getElementById('loginDialog');
  var loginForm = document.getElementById('loginForm');
  document.getElementById('loginOpen').addEventListener('click', function(){ loginDialog.hidden = false; document.getElementById('loginEmail').focus(); });
  document.getElementById('loginCancel').addEventListener('click', function(){ loginDialog.hidden = true; });
  document.getElementById('logoutBtn').addEventListener('click', function(){ if(sync) sync.logout().catch(showSyncError); });
  document.getElementById('lockBtn').addEventListener('click', function(){ if(sync) sync.setLock(!lockOn).catch(showSyncError); });
  document.getElementById('pdfBtn').addEventListener('click', function(){ if(sync) sync.setPdf(!pdfOn).catch(showSyncError); });
  loginForm.addEventListener('submit', function(e){
    e.preventDefault(); if (!sync) return;
    document.getElementById('loginError').textContent = '';
    sync.login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
      .then(function(){ loginDialog.hidden = true; loginForm.reset(); })
      .catch(function(){ document.getElementById('loginError').textContent = '로그인 정보를 확인해 주세요.'; });
  });
  function setStatus(s){ document.getElementById('syncStatus').textContent = s; }
  function showSyncError(){ setStatus('연결 확인 필요'); }
  function initializeFirebase(){
    var cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || cfg.apiKey.indexOf('[') !== -1 || !cfg.databaseURL || cfg.databaseURL.indexOf('[') !== -1) {
      setStatus(adminMode ? 'Firebase 설정 후 로그인 가능' : '자유 열람');
      return;
    }
    import('./firebase/firebase-sync.js').then(function(mod){
      if (!mod.isConfigured(cfg)) { setStatus('자유 열람'); return; }
      sync = mod.createSync(cfg, window.DECK_ID || 'codex-first-steps-20261009');
      syncReady = true;
      document.getElementById('loginOpen').hidden = !adminMode;
      if (adminMode) setStatus('강사 로그인 필요'); else setStatus('청중 자유 이동');
      sync.onState(function(state){
        if (!state) { setStatus('Firebase 연결 확인 필요'); return; }
        lockOn = !!state.locked; pdfOn = state.pdf !== false;
        document.documentElement.classList.toggle('no-pdf', !pdfOn);
        document.getElementById('printBtn').disabled = !pdfOn;
        document.getElementById('lockBtn').textContent = '잠금 ' + (lockOn ? 'ON' : 'OFF');
        document.getElementById('lockBtn').setAttribute('aria-pressed', String(lockOn));
        document.getElementById('pdfBtn').textContent = 'PDF ' + (pdfOn ? 'ON' : 'OFF');
        document.getElementById('pdfBtn').setAttribute('aria-pressed', String(pdfOn));
        if (lockOn && !isAdmin && Number.isInteger(state.slide) && state.slide >= 0 && state.slide < total && state.slide !== idx) {
          applyingRemote = true; show(state.slide); applyingRemote = false;
        }
        setStatus(lockOn ? '청중 잠금 ON' : '청중 자유 이동');
      });
      sync.onAdmin(function(allowed){
        isAdmin = !!allowed;
        document.getElementById('adminControls').classList.toggle('show', isAdmin && adminMode);
        document.getElementById('loginOpen').hidden = !adminMode || isAdmin;
        document.getElementById('logoutBtn').hidden = !adminMode || !isAdmin;
        if (isAdmin) { setStatus('강사 제어 중'); sync.setSlide(idx).catch(showSyncError); }
      });
    }).catch(function(){ setStatus('Firebase 연결 확인 필요'); });
  }
  var firebaseConfigScript = document.createElement('script');
  firebaseConfigScript.src = './firebase/firebase-config.js';
  firebaseConfigScript.onload = initializeFirebase;
  firebaseConfigScript.onerror = function(){ setStatus('자유 열람'); };
  document.head.appendChild(firebaseConfigScript);

  /* 타이머: 벽시계 기준 (탭이 뒤로 가도 시간이 밀리지 않음) */
  function initTimer(el){
    var totalSec = parseInt(el.dataset.minutes, 10) * 60;
    var remaining = totalSec;
    var endAt = null;
    var running = false;
    var tickId = null;
    var timeEl = el.querySelector('.time');
    var stateEl = el.querySelector('.state');

    function currentRemaining(){
      if (!running) return remaining;
      return Math.round((endAt - Date.now()) / 1000);
    }
    function format(sec){
      var neg = sec < 0, abs = Math.abs(sec);
      var m = Math.floor(abs / 60), s = abs % 60;
      return (neg ? '+' : '') + m + ':' + (s < 10 ? '0' + s : s);
    }
    function render(){
      var sec = currentRemaining();
      timeEl.textContent = format(sec);
      el.classList.toggle('warn', sec <= 60);
      if (stateEl) stateEl.textContent = running ? '진행' : '정지';
    }
    function start(){
      if (running) return;
      running = true;
      endAt = Date.now() + remaining * 1000;
      el.classList.add('running');
      tickId = setInterval(render, 250);
      render();
    }
    function pause(){
      if (running) remaining = currentRemaining();
      running = false;
      el.classList.remove('running');
      clearInterval(tickId);
      render();
    }
    function reset(){
      running = false;
      clearInterval(tickId);
      remaining = totalSec;
      el.classList.remove('running');
      render();
    }
    el.addEventListener('click', function(){ if (running) pause(); else start(); });
    el.addEventListener('dblclick', function(e){ e.stopPropagation(); reset(); });
    el.addEventListener('keydown', function(e){ if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') { e.preventDefault(); reset(); } });
    render();
  }
  stage.querySelectorAll('.timer-chip, .break-big[data-minutes]').forEach(initTimer);

  /* 복사 버튼: clipboard API가 700ms 안에 끝나지 않으면 textarea 폴백 · 완료 표시는 한 번만 */
  stage.querySelectorAll('.copy-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var target = document.getElementById(btn.dataset.copyTarget);
      var text = target ? target.textContent : '';
      var settled = false;
      function done(){
        if (settled) return;
        settled = true;
        btn.textContent = '복사됨 ✓';
        btn.classList.add('copied');
        setTimeout(function(){ btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        setTimeout(function(){ if (!settled) fallbackCopy(text, done); }, 700);
        navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    });
  });
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* 구형 브라우저 · 무시 */ }
    document.body.removeChild(ta);
    done();
  }

  /* 전체보기 축소판: 타이머·복사 핸들러를 붙인 뒤 마지막에 생성 · 복제본은 inert로 포커스 제외 */
  slides.forEach(function(s, n){
    var mini = document.createElement('div');
    mini.className = 'mini';
    mini.tabIndex = 0;
    mini.setAttribute('role', 'button');
    mini.setAttribute('aria-label', (s.getAttribute('aria-label') || String(n + 1)) + ' 슬라이드로 이동');
    var copy = document.createElement('div');
    copy.className = s.className.replace(/\bactive\b/, '').trim();
    copy.setAttribute('aria-hidden', 'true');
    copy.setAttribute('inert', '');
    copy.innerHTML = s.innerHTML;
    copy.querySelectorAll('[id]').forEach(function(el){ el.removeAttribute('id'); });
    var num = document.createElement('span');
    num.className = 'mini-num';
    num.setAttribute('aria-hidden', 'true');
    num.textContent = n + 1;
    var inner = document.createElement('div');
    inner.className = 'mini-inner';
    inner.appendChild(copy);
    mini.appendChild(inner);
    mini.appendChild(num);
    mini.addEventListener('click', function(){ show(n); closeGrid(); });
    mini.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(n); closeGrid(); } });
    gridList.appendChild(mini);
    minis.push(mini);
  });
  show(idx);
})();
</script>
